<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d7a">
  <title>Carnet de Pêche</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=20261102g">
  <link rel="stylesheet" href="weather.css?v=20261102g">
</head>
<body>
  <div id="map"></div>

  <!-- Boutons flottants -->
  <div class="fab-col">
    <button id="btn-layers" class="round" aria-label="Calques">🗂️</button>
    <button id="btn-locate" class="round" aria-label="Ma position">📍</button>
    <button id="btn-list" class="round" aria-label="Mes prises">📋</button>
    <button id="btn-boat" class="round" aria-label="Remplacer le bateau par un point bleu" title="Bateau / point bleu">🔵</button>
  </div>
  <div id="gps-status" class="gps-status">Recherche GPS…</div>
  <div id="wx-status" class="wx-status hidden" aria-live="polite"></div>
  <button id="btn-catch" class="main-btn">🎣 J'ai pêché un poisson</button>

  <!-- Panneau des calques -->
  <aside id="layers-panel" class="sheet hidden" aria-label="Calques">
    <div class="sheet-head">
      <h2>Calques</h2>
      <button class="close" data-close="layers-panel" aria-label="Fermer">✕</button>
    </div>

    <h3 class="sec">Fond de carte</h3>
    <div class="seg" id="base-seg" role="group" aria-label="Fond de carte">
      <button type="button" data-base="plan">🗺️ Plan</button>
      <button type="button" data-base="marine">⚓ Marine</button>
      <button type="button" data-base="sat">🛰️ Satellite</button>
    </div>

    <h3 class="sec">Profondeur d'eau</h3>
    <ul class="layers-list" id="depth-list">
      <li><label><input type="checkbox" data-depth="bathy"><span>🌊 Fonds marins <small>(couleurs)</small></span></label></li>
      <li><label><input type="checkbox" data-depth="contours"><span>〰️ Isobathes <small>(courbes de niveau)</small></span></label></li>
    </ul>
    <label class="range" for="depth-opacity">Opacité des fonds marins
      <input type="range" id="depth-opacity" min="20" max="100" value="70">
    </label>
    <p class="hint">Bathymétrie EMODnet. Indicatif : ne pas utiliser pour la navigation.</p>

    <h3 class="sec">Météo &amp; mer</h3>
    <ul class="layers-list" id="wx-list">
      <li><label><input type="checkbox" data-wx="wind"><span>💨 Vent <small>(nœuds)</small></span></label></li>
      <li><label><input type="checkbox" data-wx="temp"><span>🌡️ Température de l'air <small>(°C)</small></span></label></li>
      <li><label><input type="checkbox" data-wx="sea"><span>🌊 Température de l'eau <small>(°C)</small></span></label></li>
      <li><label><input type="checkbox" data-wx="current"><span>🧭 Courant marin <small>(nœuds)</small></span></label></li>
    </ul>
    <p class="hint">Données actuelles Open-Meteo. Température de l'eau et courant : en mer uniquement.</p>

    <h3 class="sec">Poissons</h3>
    <div class="sheet-actions">
      <button id="layers-all" class="chip">Tout afficher</button>
      <button id="layers-none" class="chip">Tout masquer</button>
    </div>
    <ul id="layers-list" class="layers-list"></ul>
    <div class="sheet-actions">
      <button id="btn-export" class="chip">⬇️ Exporter (JSON)</button>
      <label class="chip">⬆️ Importer<input id="file-import" type="file" accept="application/json" hidden></label>
    </div>
  </aside>

  <!-- Page « Mes prises » (plus récentes d'abord) -->
  <section id="catches-page" class="page hidden" aria-label="Mes prises">
    <header class="page-head">
      <button type="button" id="page-back" class="back" aria-label="Retour à la carte">←</button>
      <h2>Mes prises <span id="page-count" class="count"></span></h2>
    </header>
    <div class="page-tools">
      <select id="page-filter" aria-label="Filtrer par poisson">
        <option value="">Tous les poissons</option>
      </select>
    </div>
    <div id="page-list" class="page-list"></div>
  </section>

  <!-- Modale de capture -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="sheet-head">
        <h2 id="modal-title">Quel poisson ?</h2>
        <button class="close" id="modal-close" aria-label="Fermer">✕</button>
      </div>

      <!-- Étape 1 : choix du poisson -->
      <section id="step-pick">
        <div class="seg two" id="water-seg" role="group" aria-label="Type d'eau">
          <button type="button" data-water="fresh">🏞️ Eau douce</button>
          <button type="button" data-water="sea">🌊 Mer / océan</button>
        </div>
        <p id="water-hint" class="hint"></p>
        <div id="fish-grid" class="fish-grid"></div>
        <div id="custom-box" class="custom-box hidden">
          <label for="custom-name">Nom du nouveau poisson</label>
          <input id="custom-name" type="text" maxlength="40" placeholder="Ex : Black-bass" autocomplete="off">
          <button id="custom-ok" class="primary">Ajouter et continuer</button>
        </div>
      </section>

      <!-- Étape 2 : détails -->
      <form id="step-form" class="hidden">
        <div class="picked">
          <span id="picked-badge" class="badge"></span>
          <button type="button" id="back" class="link">Changer</button>
        </div>
        <div class="row">
          <div>
            <label for="f-size">Taille (cm)</label>
            <input id="f-size" type="number" inputmode="decimal" min="0" step="0.1" placeholder="45">
          </div>
          <div>
            <label for="f-weight">Poids (kg)</label>
            <input id="f-weight" type="number" inputmode="decimal" min="0" step="0.01" placeholder="1.2">
          </div>
        </div>
        <div class="row depth-row">
          <div>
            <label for="f-depth">Profondeur de prise (m)</label>
            <input id="f-depth" type="number" inputmode="decimal" min="0" step="0.1" placeholder="12">
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="button" id="depth-auto" class="chip">📏 Valeur de la carte</button>
          </div>
        </div>
        <p id="depth-hint" class="hint"></p>
        <label for="f-lure">Leurre utilisé</label>
        <select id="f-lure"><option value="">— Non précisé —</option></select>
        <div class="row">
          <div>
            <label for="f-lure-color">Couleur du leurre</label>
            <input id="f-lure-color" type="text" maxlength="30" list="lure-colors" placeholder="Orange" autocomplete="off">
            <datalist id="lure-colors"></datalist>
          </div>
          <div>
            <label for="f-lure-weight">Poids du leurre (g)</label>
            <input id="f-lure-weight" type="number" inputmode="decimal" min="0" step="1" placeholder="60">
          </div>
        </div>
        <label for="f-bait">Appât</label>
        <select id="f-bait">
          <option value="">— Non précisé —</option>
          <option value="Gambas">Gambas</option>
          <option value="Calamars">Calamars</option>
          <option value="Sardines">Sardines</option>
        </select>
        <label for="f-photo">Photo</label>
        <input id="f-photo" type="file" accept="image/*" capture="environment">
        <img id="photo-preview" class="photo-preview hidden" alt="Aperçu">
        <label for="f-note">Note (appât, spot…)</label>
        <textarea id="f-note" rows="2" maxlength="300" placeholder="Optionnel"></textarea>
        <p id="pos-info" class="hint"></p>
        <button type="submit" class="primary">Enregistrer la prise</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=20261102g"></script>
  <script src="maps.js?v=20261102g"></script>
</body>
</html>
